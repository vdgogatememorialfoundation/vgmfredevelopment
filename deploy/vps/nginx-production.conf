# Public site: https://vaidyagogate.org (www redirects to the apex).
# Unlike the staging/demo snippet, this must NOT send X-Robots-Tag noindex.
upstream vgmf_production {
    server 127.0.0.1:3007;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vaidyagogate.org www.vaidyagogate.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://vaidyagogate.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vaidyagogate.org;

    ssl_certificate /etc/letsencrypt/live/vaidyagogate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaidyagogate.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vaidyagogate.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vaidyagogate.org;

    ssl_certificate /etc/letsencrypt/live/vaidyagogate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaidyagogate.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /_next/static/ {
        proxy_pass http://vgmf_production;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_hide_header X-Powered-By;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        proxy_pass http://vgmf_production;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
