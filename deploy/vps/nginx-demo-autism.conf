# Demo copy of autism.vaidyagogate.org
# DNS A record already points demo.autism.vaidyagogate.org at 89.116.32.1.
upstream autism_demo {
    server 127.0.0.1:3014;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.autism.vaidyagogate.org;
    client_max_body_size 50M;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_hide_header X-Robots-Tag;
        proxy_pass http://autism_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
