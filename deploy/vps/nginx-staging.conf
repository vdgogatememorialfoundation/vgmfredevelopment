# Staging: canonical origin is https://staging.vaidyagogate.org so admin
# localStorage/cookies are not split across HTTP vs HTTPS or stagging vs staging.
upstream vgmf_staging {
    server 127.0.0.1:3005;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.vaidyagogate.org stagging.vaidyagogate.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://staging.vaidyagogate.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.vaidyagogate.org;

    ssl_certificate /etc/letsencrypt/live/staging.vaidyagogate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.vaidyagogate.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        include /etc/nginx/snippets/vgmf-security-headers.conf;
        proxy_hide_header X-Robots-Tag;
        proxy_pass http://vgmf_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
