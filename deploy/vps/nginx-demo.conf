# Demo copy of customer, admin, staff and support.
# After DNS points here, run: certbot --nginx -d demo.vaidyagogate.org
# Also enable deploy/vps/nginx-ssl-default.conf so unknown HTTPS names do not
# fall through to autism.vaidyagogate.org (nginx's first SSL vhost).
upstream vgmf_demo {
    server 127.0.0.1:3012;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.vaidyagogate.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://vgmf_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
